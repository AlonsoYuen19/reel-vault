name: reel_vault
description: Flutter app for discovering and managing movies and series, developed following clean architecture and best practices with Riverpod.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  genui: ^0.9.2
  go_router: ^17.3.0
  google_generative_ai: ^0.4.3
  graphql_flutter: ^5.3.0
  hive_flutter: ^1.1.0
  json_annotation: ^4.12.0
  mocktail: ^1.0.5
  riverpod_annotation: ^4.0.2
  talker_dio_logger: ^5.1.17
  talker_flutter: ^5.1.17
  url_launcher: ^6.3.2
  youtube_player_flutter: ^10.0.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
